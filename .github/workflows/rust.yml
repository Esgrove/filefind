name: Rust

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rust.yml"
      - "**.rs"
      - "**/Cargo.lock"
      - "**/Cargo.toml"
  pull_request:
    paths:
      - ".github/workflows/rust.yml"
      - "**.rs"
      - "**/Cargo.lock"
      - "**/Cargo.toml"

# Cancel previous runs for PRs but not pushes to main
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build
        if: runner.os == 'Windows'
        run: cargo build

      - name: Run tests
        if: runner.os == 'Windows'
        run: cargo test --no-fail-fast

      - name: Test portable database and directory walker
        if: runner.os != 'Windows'
        run: |
          cargo test -p filefind --lib
          cargo test -p filefind-daemon --bin filefindd watcher::tests::

      - name: Check formatting
        run: cargo fmt --check --verbose

      - name: Lint
        if: runner.os == 'Windows'
        run: cargo clippy -- -Dwarnings

      - name: Lint portable crates
        if: runner.os != 'Windows'
        run: cargo clippy -p filefind -p filefind-daemon --all-targets -- -Dwarnings
