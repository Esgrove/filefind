[workspace]
resolver = "3"
members = ["filefind", "filefind-cli", "filefind-daemon", "filefind-tray"]

[workspace.package]
version = "1.7.2"
edition = "2024"
authors = ["Esgrove <esgrove@outlook.com>"]
license = "MIT"
repository = "https://github.com/Esgrove/filefind"
rust-version = "1.98"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
colored = "3.1.1"
dirs = "7.0.0"
regex = "1.13.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ctrlc = "3.5.2"
indicatif = "0.18.6"
tempfile = "3.27.0"

[workspace.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_Pipes",
]

[workspace.dependencies.filefind]
path = "filefind"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "allow"

[workspace.lints.clippy]
# https://rust-lang.github.io/rust-clippy/master/index.html
fn_params_excessive_bools = "allow"
struct_excessive_bools = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

cast_possible_wrap = "deny"
char_lit_as_u8 = "deny"
enum_glob_use = "deny"
exit = "deny"
fn_to_numeric_cast = "deny"
fn_to_numeric_cast_with_truncation = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
ptr_as_ptr = "deny"
string_slice = "deny"
unchecked_time_subtraction = "deny"
unimplemented = "deny"
unnecessary_cast = "deny"
unwrap_used = "deny"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.dev]
incremental = true

[profile.release]
lto = true
codegen-units = 1
